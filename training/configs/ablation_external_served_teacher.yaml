# Teacher-source ablation: the teacher is an external OpenAI-compatible endpoint
# instead of an in-process reference policy.
#
# OPSD_TEACHER_SOURCE=external makes the trainer fetch top-k log-probs over the whole
# response in a single echo call per sample (not one call per token). This frees the
# HBM an in-process teacher would hold, at the cost of a network hop per sample and a
# hard requirement that the served model share the student's tokenizer.
#
# Set OPSD_TEACHER_BASE_URL/OPSD_TEACHER_API_KEY for your endpoint; training/
# serve_opsd_teacher_vllm.sh starts a local one.
#
# Machine-specific paths below are placeholders. Render before launching:
#   scripts/tools/render_config.py training/configs/ablation_external_served_teacher.yaml \
#       --site training/configs/site.env -o /tmp/run.yaml
# then: bash <rllm>/examples/swe/run_npu_train_from_yaml.sh /tmp/run.yaml
# Shared memory/length tuning is explained once in docs/TRAINING.md.
runtime:
  conda_env: '{{CONDA_ENV}}'
  entrypoint: DeepSWE_RL/rllm/examples/swe/train_entrypoint_npu.sh
  log_dir: output/ablation_external_served_teacher
  log_prefix: ablation_external_served_teacher
  clean_ray_before_start: true
env:
  PYTHONNOUSERSITE: '1'
  RAY_agent_register_timeout_ms: '600000'
  RAY_raylet_start_wait_time_s: '1200'
  ASCEND_RT_VISIBLE_DEVICES: 0,1,2,3,4,5,6,7
  NPU_VISIBLE_DEVICES: 0,1,2,3,4,5,6,7

  # ---- devices, layout and backend runtime ----
  TRAINER_LAYOUT_MODE: colocated
  HYBRID_ENGINE: 'True'
  HCCL_OP_EXPANSION_MODE: AIV
  ROLLOUT_HCCL_OP_EXPANSION_MODE: AIV
  TASK_QUEUE_ENABLE: '1'
  PYTORCH_NPU_ALLOC_CONF: max_split_size_mb:256
  TRAIN_N_GPUS_PER_NODE: '8'
  TRAIN_DEVICE: npu

  # ---- policy weights and resume ----
  MODEL_PATH: '{{SFT_MODEL_4B}}'
  # Student still warm-starts from the SFT checkpoint. With an external teacher the OPSD
  # reverse-KL target is the SERVED model (below), NOT this MODEL_PATH -- so this is a genuine
  # teacher != student setup.
  TRAINER_RESUME_MODE: disable
  TRAINER_RESUME_FROM_PATH: 'null'
  TRAINER_RESUME_LOAD_DATALOADER: 'False'
  TRAINER_STAGE_GLOBAL_STEP_OFFSET: '0'
  OPD_RENDER_PROMPT_AT_RUNTIME: '1'

  # ---- logging ----
  TRAIN_LOGGERS: console,tensorboard,wandb
  WANDB_ENABLE: '1'
  WANDB_MODE: online
  WANDB_INIT_TIMEOUT: '300'

  # ---- RL algorithm and batch shape ----
  RL_ALGO: grpo
  TRAIN_BATCH_SIZE: '16'
  PPO_MINI_BATCH_SIZE: '1'
  ACTOR_PPO_MICRO_BATCH_SIZE_PER_GPU: '1'
  LOGPROB_MICRO_BATCH_SIZE_PER_GPU: '1'
  ROLLOUT_N: '4'

  # ---- rollout engine (vLLM) ----
  ROLLOUT_MAX_NUM_SEQS: '36'
  ROLLOUT_ACTIVE_TRAJECTORIES: '36'
  ROLLOUT_CONTEXT_WINDOW_SAFETY_MARGIN: '2048'
  ROLLOUT_PER_STEP_MAX_TOKENS: '8192'
  ROLLOUT_FIRST_STEP_MAX_TOKENS: '4096'
  ROLLOUT_INVALID_TOOL_CALL_MAX_TOKENS: '2048'
  ROLLOUT_INVALID_TOOL_CALL_RETRY_LIMIT: '12'
  ROLLOUT_STOP_AFTER_FUNCTION_CALL: 'True'
  ROLLOUT_GPU_MEMORY_UTILIZATION: '0.26'
  ROLLOUT_ENFORCE_EAGER: 'True'
  ROLLOUT_FREE_CACHE_ENGINE: 'True'
  ROLLOUT_ENABLE_SLEEP_MODE: 'True'
  PIPELINE_TRAIN_AFTER_FULL_ROLLOUT: '1'
  PIPELINE_LENGTH_BUCKET_ROLLOUTS: '1'
  ROLLOUT_ENABLE_CHUNKED_PREFILL: 'True'
  ROLLOUT_ASCEND_SCHEDULER_ENABLE: 'True'
  ROLLOUT_ASCEND_SCHEDULER_ENABLE_CHUNKED_PREFILL: 'True'
  ROLLOUT_ASCEND_SCHEDULER_MAX_LONG_PARTIAL_PREFILLS: '2147483647'
  ROLLOUT_ASCEND_SCHEDULER_LONG_PREFILL_TOKEN_THRESHOLD: '2147483647'
  ROLLOUT_ENABLE_PREFIX_CACHING: 'False'
  ROLLOUT_BLOCK_SIZE: '128'
  ROLLOUT_CUDAGRAPH_CAPTURE_SIZES: '[16,8,4,2,1]'
  RLLM_FORCE_VLLM_WEIGHT_SYNC_SHM: '1'
  RLLM_DISABLE_FSDP_SYNC_MODULE_STATES: '1'
  TOTAL_EPOCHS: '1'
  ENABLE_VALIDATION: '0'
  MEMORY_PROFILE: stable

  # ---- memory and parallelism ----
  MODEL_USE_REMOVE_PADDING: 'True'
  MODEL_ENABLE_ACTIVATION_OFFLOAD: 'True'
  ULYSSES_SEQUENCE_PARALLEL_SIZE: '8'
  ACTOR_ENTROPY_CHECKPOINTING: 'True'
  ACTOR_ENTROPY_CHUNK_SIZE: '512'
  ACTOR_ENTROPY_COEFF: '0.005'
  ROLLOUT_TP_SIZE: '8'
  ACTOR_OPTIMIZER_FOREACH: 'False'
  ACTOR_USE_DYNAMIC_BSZ: 'False'
  LOGPROB_USE_DYNAMIC_BSZ: 'False'
  PG_LOSS_AGG_MODE: seq-mean-token-mean

  # ---- staged privileged distillation ----
  OPSD_ENABLE: '1'
  OPSD_LOSS_COEF: '0.15'
  OPSD_POLICY_LOSS_MODE: pg_plus_opsd
  # ============================ EXTERNAL DELTA (1/4): teacher source ============================
  # external = a separate, served model scores the student tokens over HTTP (teacher != student).
  OPSD_TEACHER_SOURCE: external
  # Endpoint of the served teacher. Leave as env-driven; export before launching:
  #   OPSD_TEACHER_BASE_URL (e.g. http://<host>:8000/v1), OPSD_TEACHER_MODEL (served name).
  # The entrypoint falls back OPSD_TEACHER_BASE_URL -> OPENAI_BASE_URL and
  # OPSD_TEACHER_MODEL -> MODEL_SERVE_NAME if unset, but set them explicitly for the teacher.
  OPSD_TEACHER_BASE_URL: ''
  OPSD_TEACHER_MODEL: ''
  OPSD_TEACHER_API_KEY: 'EMPTY'
  # top-K logp per position (the reverse-KL target width). 16 matches the ref_policy run.
  OPSD_TOPK_K: '16'
  # Single echo call per sample. Set to 1 ONLY if the teacher server lacks echo-logprob support.
  OPSD_TEACHER_PER_TOKEN: '0'
  # Generous timeout: one echo call covers a full (up to 40960-token) response in one forward.
  OPSD_TEACHER_TIMEOUT_SEC: '600'
  # ============================ EXTERNAL DELTA (2/4): fail-open for bring-up ====================
  # True during bring-up so a transient teacher-server hiccup skips OPSD for that sample instead
  # of killing the run. Flip to False once the endpoint is proven stable (to catch silent misconfig).
  OPSD_FAIL_OPEN: 'True'
  # ============================ EXTERNAL DELTA (3/4): stage routing OFF =========================
  # External path scores under a SINGLE privileged context per trajectory; it cannot do per-token
  # 3-variant routing (that is ref_policy-only). Keep 0 to avoid a misleading stage_routed metric.

  # ---- stage router ----
  OPSD_STAGE_ROUTING: '0'
  OPSD_STAGE_BACKTRACK: '3'
  # ref_load_checkpoint_from_resume is irrelevant to the external teacher (kept for entrypoint parity).
  OPSD_REF_LOAD_CHECKPOINT_FROM_RESUME: 'False'
  OPSD_MAX_TOKENS_PER_SAMPLE: '0'
  OPSD_ROUTE_SUCCESS_GRPO_FAILURE_OPSD: '0'
  USE_RLSD: 'False'
  USE_OPSD_KL: 'True'
  # RLSD is an earlier importance-weighted variant kept for reference; with
  # USE_RLSD=False every RLSD_* knob below is inert.
  RLSD_WEIGHT_CLIP_EPS: '0.2'
  RLSD_DELTA_CLIP: '5.0'
  RLSD_USE_OLD_STUDENT_LOGP: 'True'
  RLSD_USE_ROLLOUT_LOGP_AS_STUDENT_PRIOR: 'True'
  RLSD_TEACHER_NO_GRAD: 'True'
  RLSD_LOG_STATS: 'False'

  # ---- reward shaping ----
  EXPLORATION_TOOL_REWARD_COEF: '0.0'
  EXPLORATION_TOOL_REWARD_MAX: '0.0'
  EXPLORATION_TOOL_MIN_CALLS: '1'
  EXPLORATION_TOOL_MISSING_PENALTY: '0.0'
  EXPLORATION_NO_TOOL_CALL_PENALTY: '0.0'
  EXPLORATION_REWARD_CLAMP_MIN: '-1.0'
  EXPLORATION_REWARD_CLAMP_MAX: '1.0'
  SOFT_OVERLONG_REWARD_FACTOR: '0.5'
  GIVE_UP_EMPTY_PATCH_PENALTY: '-0.2'
  RLLM_R2EGYM_FORCE_EXECUTION_COMMANDS: '1'
  # ============================ EXTERNAL DELTA (4/4): still end-to-end student prompt ===========
  # Student prompt = the unified agentic (eval scaffold) prompt; the external teacher scores those
  # same tokens conditioned on the single privileged teacher context per trajectory.
  OPD_END_TO_END_PROMPT: '1'
  R2EGYM_DOCKER_HOST: tcp://127.0.0.1:23750
  DOCKER_HOST: tcp://127.0.0.1:23750
  R2EGYM_TIMING: '1'
  PREPULL_DATASET_IMAGES: '0'

  # ---- run identity and data ----
  PROJECT_NAME: swe_ladder
  EXPERIMENT_NAME: ablation-external-served-teacher
  TRAIN_DATASET: '{{DATA_ROOT}}/staged_opd_joint_swerebench500_r2e200_swegym100_swesmith500_task_intersection/patch_generation/train_verl.parquet'
  VAL_DATASET: '{{DATA_ROOT}}/staged_opd_joint_swerebench500_r2e200_swegym100_swesmith500_task_intersection/patch_generation/valid_verl.parquet'
  WANDB_PROJECT: swe_ladder
  WANDB_TAGS: opsd+grpo,no-router,teacher-external,scaffold-r2egym,qwen3-4b,8xnpu-colocated

  # ---- episode budget and length envelope ----
  AGENT_MAX_STEPS: '104'
  AGENT_TRAJECTORY_TIMEOUT: '7200'
  MAX_PROMPT_LENGTH: '10240'
  MAX_RESPONSE_LENGTH: '51200'
  PPO_MAX_TOKEN_LEN_PER_GPU: '51200'
  LOGPROB_MAX_TOKEN_LEN_PER_GPU: '51200'
  ROLLOUT_MAX_MODEL_LEN: '61440'
  AGENT_MAX_RESPONSE_TOKENS_FOR_TRAINING: '40960'
  ROLLOUT_MAX_NUM_BATCHED_TOKENS: '16384'
  OPSD_MAX_RESPONSE_TOKENS_FOR_TRAINING: '40960'
  RLSD_ACTOR_MAX_PACKED_CONTEXT_TOKENS: '51200'
  RLSD_LAMBDA: '0.5'
  RLSD_LAMBDA_INIT: '0.5'
  RLSD_LAMBDA_FINAL: '0.1'
  RLSD_LAMBDA_DECAY_STEPS: '100'

  # ---- per-stage auxiliary rewards (off: end-to-end reward only) ----
  CAUSAL_LOCALIZATION_REWARD_ENABLE: '0'
  DISABLE_EXECUTION_REWARD: '0'
  ISSUE_REPRODUCTION_EVAL_ENABLE: '0'
  ISSUE_REPRODUCTION_REWARD_ENABLE: '0'
